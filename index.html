<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="row">
            <div class="col-6">
                <h1 class="display-3">Formulário Bootstrap</h1>
                <form>
                    <label for="nome" class="form-label pt-3">Nome:</label>
                    <input type="text" id="nome" class="form-control">
                    <label for="email" class="form-label pt-3">Email:</label>
                    <input type="email" id="email" class="form-control">
                    <label for="telefone" class="form-label pt-3">Telefone:</label>
                    <input type="tel" id="telefone" class="form-control">
                    <button type="button" class="btn btn-primary mt-3 btn-lg">Enviar</button>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
