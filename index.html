<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício JS DOM</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="container">
        <h1>Insira dois números cujo o valor do número A seja <span class="green-span">MAIOR</span> que o valor do número B</h1>
        <h2>nºA > nºB</h2>
        <form action="" id="form-numbers">
            <input type="number" name="number" id="first-number" placeholder="Número A" required>
            <input type="number" name="number" id="second-number" placeholder="Número B" required>
            <p class="error-message">O primeiro número é menor que o segundo número</p>
            <p class="sucess-message">Números Válidos!</p>
            <button type="submit">Enviar</button>
        </form>
    </div>
    <script src="./script.js"></script>
</body>
</html>
